<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PradaGram</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:dark;--bg:#101923;--c:#1b2636;--c2:#273649;--a:#3aa0f0;--m:#7b8ba0;--r:#e5534b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Roboto,system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
svg{display:block;flex:none}
.scr{position:absolute;inset:0;overflow-y:auto;padding:0 12px 120px}
.top{display:flex;align-items:center;gap:12px;padding:14px 4px;position:sticky;top:0;background:var(--bg);z-index:3}
.top h1{font-size:30px;font-weight:500;flex:1;letter-spacing:.2px}
.ib{background:none;border:0;color:#fff;padding:6px;border-radius:50%;cursor:pointer}
.av{width:56px;height:56px;border-radius:50%;background:#3b82c4 center/cover;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:22px;flex:none;position:relative;color:#fff}
.av.blk{background-color:#000;border:1px solid #2a3547}.av.sm{width:32px;height:32px;font-size:13px}.av.big{width:110px;height:110px;font-size:40px}
.row{display:flex;gap:14px;align-items:center;padding:10px 6px;cursor:pointer;border-radius:14px}
.row:active{background:var(--c)}
.row .mid{flex:1;min-width:0}.row b{font-weight:500;font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--m);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.rt{text-align:right;color:var(--m);font-size:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.bd{background:var(--a);color:#fff;border-radius:14px;min-width:28px;height:28px;padding:0 9px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px}
.empty{color:var(--m);text-align:center;padding:60px 30px;line-height:1.5}
nav{position:absolute;left:12px;right:12px;bottom:12px;background:#1b2636ee;backdrop-filter:blur(10px);border-radius:34px;display:flex;padding:7px;z-index:5;box-shadow:0 4px 20px #0007}
nav button{flex:1;background:none;border:0;color:#c3cedb;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:26px;font:500 14px Roboto;cursor:pointer;transition:.25s}
nav button.on{background:#223a58;color:var(--a)}
#fab{position:absolute;right:20px;bottom:108px;width:64px;height:64px;border-radius:50%;background:var(--a);border:0;color:#fff;z-index:4;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0009;cursor:pointer;transition:transform .25s}
#fab.o{transform:rotate(90deg) scale(.9)}
#sheet{position:absolute;right:20px;bottom:184px;z-index:6;display:flex;flex-direction:column;gap:10px;align-items:flex-end;transform-origin:bottom right;transition:.25s;opacity:0;transform:scale(.6);pointer-events:none}
#sheet.o{opacity:1;transform:none;pointer-events:auto}
#sheet button{display:flex;gap:10px;align-items:center;background:var(--c2);border:0;color:#fff;font:500 16px Roboto;padding:14px 20px;border-radius:26px;cursor:pointer;box-shadow:0 4px 14px #0008}
.card{background:var(--c);border-radius:26px;padding:8px 10px;margin:10px 0}
.tile{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ph{text-align:center;padding:10px 0 6px}.ph b{display:block;font-size:34px;font-weight:500;margin-top:12px}.ph span{color:var(--m);font-size:19px}
.ph .av{margin:0 auto}
.pg{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:in .28s ease-out;overflow:hidden}
.pg.out{animation:out .22s ease-in forwards}
@keyframes in{from{transform:translateX(100%)}to{transform:none}}@keyframes out{to{transform:translateX(100%)}}
.pgt{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);z-index:3;position:relative}
.pgt h2{font-size:21px;font-weight:500;flex:1}.pgb{flex:1;overflow-y:auto;padding:8px 14px 30px;position:relative;z-index:2}
input,textarea{width:100%;background:var(--c);border:1px solid #2c3b50;color:#fff;border-radius:16px;padding:15px 16px;font:400 17px Roboto;outline:0;margin:6px 0}
input:focus,textarea:focus{border-color:var(--a)}
.btn{width:100%;background:var(--a);border:0;color:#fff;font:500 17px Roboto;padding:15px;border-radius:16px;cursor:pointer;margin-top:8px}
.btn.g{background:var(--c2)}.btn.r{background:#7a2b2b}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1;background:var(--c);border:1px solid #2c3b50;color:#fff;border-radius:16px;padding:12px 8px;font:500 15px Roboto;cursor:pointer;line-height:1.3}
.seg button small{display:block;font-weight:400;color:var(--m);font-size:12px}.seg button.on{border-color:var(--a);background:#203a58}
.note{color:var(--m);font-size:14px;line-height:1.5;margin:10px 2px}.err{color:#ff7b72;font-size:14px;min-height:18px;margin:4px 2px}
.auth{max-width:440px;margin:0 auto;padding:30px 18px}.auth h1{font-size:28px;font-weight:500;margin:20px 0 6px}
.lbl{color:var(--a);font-weight:500;font-size:15px;padding:8px 6px 0}
.fld{padding:8px 6px 12px;font-size:18px;cursor:pointer;min-height:44px}
.fld.e{color:var(--m)}
.modal{position:absolute;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.modal>div{background:var(--c);border-radius:26px;padding:22px;width:100%;max-width:400px}.modal h3{font-weight:500;font-size:20px;margin-bottom:8px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#2d3d54;padding:12px 20px;border-radius:20px;z-index:99;font-size:15px;max-width:90%;text-align:center}
.cv{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.frame{margin:18vh auto 0;max-width:380px;background:#0b1320bb;backdrop-filter:blur(6px);border:2px solid #f5b83a;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 0 40px #f5b83a44}
.frame.p{border-color:#2fd16b;box-shadow:0 0 40px #2fd16b44}
.frame h3{font-size:26px;font-weight:700;letter-spacing:.5px}
.sc{display:flex;align-items:center;justify-content:center;gap:14px;font-size:46px;font-weight:700;margin-top:18px}
.msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:6px;position:relative}
.m{display:flex;gap:8px;align-items:flex-end;max-width:100%}.m.me{justify-content:flex-end}
.bub{background:var(--c);border-radius:18px;padding:8px 12px;max-width:78%;font-size:17px;line-height:1.35;word-break:break-word}
.me .bub{background:#2b5278}.bub .n{font-weight:500;font-size:15px;cursor:pointer;margin-bottom:2px}
.tm{color:#ffffff88;font-size:12px;float:right;margin:6px 0 0 10px}
.post{background:var(--c);border-radius:18px;padding:10px 14px;max-width:92%;font-size:17px;line-height:1.4;word-break:break-word}
.post .n{color:var(--a);font-weight:500;margin-bottom:4px}.post .f{display:flex;gap:6px;align-items:center;color:#ffffff88;font-size:13px;justify-content:flex-end;margin-top:6px}
.comp{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--bg)}
.comp input{margin:0;border-radius:26px;flex:1}.send{background:var(--a);border:0;border-radius:50%;width:48px;height:48px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ro{padding:16px;text-align:center;color:var(--m);background:var(--c)}
.dv{padding:12px 6px;border-bottom:1px solid #2a384b}.dv small{color:var(--m)}
.chip{color:#7ee0a0;font-size:13px}

/* ---- переходы ---- */
.pg{animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.85,.25,1)}
.pg.out{animation:out .26s cubic-bezier(.5,0,.9,.5) forwards}
.fx{animation:tabin .35s cubic-bezier(.2,.8,.2,1)}
#tc.ta>.scr{animation:tabin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes tabin{from{opacity:0;transform:translateY(12px)}}
.modal>div{animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
.modal.out{animation:fo .19s ease-in forwards}.modal.out>div{animation:pd .19s ease-in forwards}
@keyframes fo{to{opacity:0}}@keyframes pd{to{opacity:0;transform:scale(.94) translateY(8px)}}
.toast{animation:ti .28s cubic-bezier(.2,.9,.3,1.1)}.toast.out{animation:tq .25s ease-in forwards}
@keyframes ti{from{opacity:0;transform:translate(-50%,14px)}}@keyframes tq{to{opacity:0;transform:translate(-50%,10px)}}
nav button.on{background:#1f3550;color:#42a5f5}
/* ---- настройки как в Telegram ---- */
.sh{position:relative;text-align:center;padding:26px 0 4px}
.mm{position:absolute;right:0;top:4px}
.sav{position:relative;width:96px;margin:0 auto;cursor:pointer}
.sav .vr{margin:0;display:block}
.av.xl{width:96px;height:96px;font-size:36px}
.cm{position:absolute;right:-4px;bottom:-2px;width:31px;height:31px;border-radius:50%;background:#2a9df4;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;color:#fff;z-index:2}
.sn{font-size:22px;font-weight:700;margin-top:14px;display:flex;align-items:center;justify-content:center}
.su{color:var(--m);font-size:14px;margin-top:3px}
.sv{color:#5ab4f5;font-size:13.5px;margin-top:3px}
.cd{background:var(--c);border-radius:20px;margin:14px 0;overflow:hidden}
.st{display:flex;align-items:center;gap:19px;height:63px;padding:0 19px;cursor:pointer;transition:background .15s}
.st.s1{height:52px}.st:active{background:#ffffff0d}
.st .tile{width:29px;height:29px;border-radius:8px}
.st .tx{min-width:0;flex:1}.tl{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{color:var(--m);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd{color:#4fa3e8;font-weight:500;font-size:15px;padding:14px 19px 4px}
/* ---- звёзды ---- */
.pg.tr .pgt{background:transparent}
.cv.fb{-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.stp{text-align:center;padding-top:34px;position:relative}
.stbig{animation:fl 3.2s ease-in-out infinite}
.stbig svg{margin:0 auto}
.sh .sav+.sn.ow{margin-top:34px}
@keyframes fl{50%{transform:translateY(-6px)}}
.stp h2{font-size:23px;font-weight:700;margin-top:20px}
.stp p{color:var(--m);font-size:16.5px;line-height:1.4;margin:10px 18px 0}
.bal{background:var(--c);border-radius:26px;padding:26px 20px 22px;margin-top:34px;text-align:center}
.bn{display:flex;gap:8px;justify-content:center;align-items:center;font-size:38px;font-weight:500}
.bl{color:var(--m);font-size:15px;margin-top:4px}
.bb{display:flex;gap:9px;margin-top:22px}
.pill{flex:1;height:50px;border:0;border-radius:25px;background:#1e96f0;color:#fff;font:500 17px Roboto;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.pill:active{filter:brightness(.9)}
.ops{background:var(--c);border-radius:26px;margin-top:14px;overflow:hidden;text-align:left}
.tb{display:flex;border-bottom:1px solid #263447}
.tb button{flex:1;background:none;border:0;color:var(--m);font:500 16px Roboto;padding:18px 4px;position:relative;cursor:pointer;transition:color .2s}
.tb button.on{color:#3ea3f2}
.tb button::after{content:'';position:absolute;left:16%;right:16%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#3ea3f2;transform:scaleX(0);transition:transform .25s}
.tb button.on::after{transform:none}
.op{display:flex;gap:14px;align-items:center;padding:12px 16px}
.op .mid{flex:1;min-width:0}.op b{display:flex;align-items:center;font-weight:500;font-size:17px}
.op .s{color:var(--m);font-size:15px;margin-top:2px}
.av.op{width:48px;height:48px;font-size:18px}
.am{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:500}.am.pl{color:#4cc968}.am.mn{color:#e5534b}
/* ---- галочка и кольцо владельца ---- */
.vb{display:inline-flex;flex:none;vertical-align:middle;width:var(--s);height:var(--s);margin-left:5px}.vb svg{width:100%;height:100%}
.vr{position:relative;display:inline-block;margin:16px}
.vr .av{box-shadow:0 0 0 3px #2a9df4,0 0 22px #2a9df466}
.orb{position:absolute;left:50%;top:50%;width:0;height:0;animation:spin 16s linear infinite;pointer-events:none}
.orb i{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--r)*-1))}
.orb b{position:absolute;left:-9px;top:-9px;width:18px;height:18px;animation:cs 16s linear infinite}
.orb b svg{display:block;width:18px;height:18px;animation:tw 2.4s ease-in-out infinite}
.orb i:nth-child(odd) svg{animation-delay:-1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cs{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(calc(var(--a)*-1 - 360deg))}}
@keyframes tw{50%{transform:scale(1.4);opacity:.7}}
.eco .orb,.eco .orb *,.eco .stbig{animation:none!important}

/* ---- нижнее меню как в Telegram ---- */
nav{left:50%;right:auto;transform:translateX(-50%);bottom:14px;padding:5px;border-radius:32px;background:#1a2535e8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{flex:none;width:88px;height:49px;padding:0;gap:2px;font:500 12.5px Roboto;border-radius:25px;justify-content:center}
nav button.on{background:#223a58;color:#4aa8f5}
.nav-av{width:26px;height:26px;border-radius:50%;background:center/cover #3b82c4;display:block}
/* ---- профиль ---- */
.sh2{position:relative;text-align:center;padding:30px 0 6px}
.av.pf{width:100px;height:100px;font-size:36px}
.pav{position:relative;width:100px;margin:0 auto;cursor:pointer}.pav .vr{margin:0;display:block}
.pnm{font-size:21px;font-weight:500;margin-top:16px;display:flex;align-items:center;justify-content:center}
.pst{color:var(--m);font-size:16px;margin-top:4px}
.sp{color:#f5b83a;font-size:13.5px;margin-top:3px}
.pbs{display:flex;gap:8px;margin:20px 0 14px}
.pb{flex:1;height:56px;border:0;border-radius:20px;background:#243449;color:#fff;font:500 13.5px Roboto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:background .15s}.pb:active{background:#2c3f57}
.ir{padding:11px 19px;min-height:63px;display:flex;flex-direction:column;justify-content:center;cursor:default;word-break:break-word}
.ir.c{cursor:pointer}.ir.c:active{background:#ffffff0d}
.iv{font-size:18px;line-height:1.3}.il{color:var(--m);font-size:14px;margin-top:3px}
.ml{color:#6ab7f5;cursor:pointer;text-decoration:none}
/* ---- экран «Аккаунт» ---- */
.cd .lb{color:#4fa3e8;font-weight:500;font-size:15px;padding:16px 19px 0}
.cd input{background:transparent;border:0;border-radius:0;margin:0;padding:12px 19px 14px;font-size:19px}
.inp-row{display:flex;align-items:center}.inp-row input{flex:1}
.cnt{color:var(--m);font-size:16px;padding-right:19px}
.hint{color:var(--m);font-size:15px;line-height:1.35;padding:0 19px;margin:-4px 0 14px}
.st.red{color:#ef5b5b}.st.red .tl{color:#ef5b5b}
.un{display:flex;align-items:center;padding:6px 19px 14px;font-size:19px}.un span{color:#fff}.un input{padding:6px 0;text-decoration:underline;font-size:19px;flex:1;min-width:0}
.us{font-size:15px;padding:0 19px;margin:-2px 0 10px;min-height:20px}.us.ok{color:#4cc968}.us.bad{color:#ef5b5b}.us.n{color:var(--m)}
select{flex:1;min-width:0;background:var(--c2);color:#fff;border:1px solid #2c3b50;border-radius:14px;padding:13px 6px;font:500 16px Roboto;outline:0}
/* ---- Premium ---- */
.plans{background:var(--c);border-radius:26px;margin-top:22px;overflow:hidden;text-align:left}
.pl{display:flex;align-items:center;gap:16px;padding:0 18px;height:61px;cursor:pointer;border-bottom:1px solid #263447;transition:background .15s}
.pl:last-child{border-bottom:0}.pl:active{background:#ffffff0a}
.rd{width:26px;height:26px;border-radius:50%;border:2.5px solid #4a5a70;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:.2s}
.pl.on .rd{background:#6c7bff;border-color:#6c7bff}.rd svg{opacity:0;transition:opacity .2s}.pl.on .rd svg{opacity:1}
.pl .tx{flex:1;min-width:0}.pl .tl{font-weight:500}.pl .pr{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:500}
.pfoot{position:absolute;left:0;right:0;bottom:0;padding:26px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 45%);z-index:4}
.buy{width:100%;height:56px;border:0;border-radius:28px;background:linear-gradient(90deg,#7b86ff,#a855f7 55%,#e0589f);color:#fff;font:500 18px Roboto;cursor:pointer;box-shadow:0 4px 20px #a855f755}.buy:active{filter:brightness(.92)}.buy:disabled{opacity:.7}
.fi{display:flex;gap:16px;padding:14px 18px;align-items:flex-start;text-align:left}.fi .tile{width:34px;height:34px;border-radius:10px}
.fi b{display:block;font-weight:500;font-size:17px}.fi span{display:block;color:var(--m);font-size:15px;margin-top:3px;line-height:1.35}

/* ---- подарки ---- */
.gi{display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}.gi.dim{opacity:.35;filter:grayscale(.6)}
.bs{position:absolute;inset:0;background:#0009;z-index:60;display:flex;align-items:flex-end;animation:fd .2s}
.bs.out{animation:fo .22s ease-in forwards}
.bsc{position:relative;width:100%;max-height:92%;background:#1d2a3b;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:su .32s cubic-bezier(.2,.85,.25,1);overflow:hidden}
.bs.out .bsc{animation:sd .22s ease-in forwards}
@keyframes su{from{transform:translateY(100%)}}@keyframes sd{to{transform:translateY(100%)}}
.bs1{height:80%}.bs2{height:92%}
.bst{font-size:23px;font-weight:500;padding:22px 22px 18px;border-bottom:1px solid #121b27;flex:none}
.bsb{flex:1;overflow-y:auto;position:relative}
.gsrch{background:transparent!important;border:0!important;border-bottom:1px solid #121b27!important;border-radius:0!important;margin:0!important;padding:20px 22px!important;font-size:19px!important;flex:none}
.gh{color:var(--m);font-size:16px;font-weight:500;padding:14px 22px;background:#17222f}
.gr{display:flex;gap:14px;align-items:center;padding:10px 14px 10px 18px;cursor:pointer}
.gr:active{background:#ffffff0d}.gr.me{background:#2c394b}
.gr .av{width:48px;height:48px;font-size:18px}.gr .mid{flex:1;min-width:0;border-bottom:1px solid #162230;padding:6px 0 10px}
.gr b{display:flex;align-items:center;font-weight:500;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .s{color:var(--m);font-size:15px;margin-top:3px}.gr .s.on{color:#4aa8f5}.gr.me .s{color:#9fb0c4}
.gr .mid{margin:-10px 0}.gdt{color:#9fb0c4;margin-left:auto}
.gph{text-align:center;position:relative;padding-top:6px}
.gbal{position:absolute;right:0;top:0;text-align:right}.gbl{font-size:17px;font-weight:500}.gbn{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:20px;font-weight:500;margin-top:2px}
.gav .av{width:84px;height:84px;margin:14px auto 0}
.gph h2{font-size:24px;font-weight:700;margin-top:22px}.gph p{color:#d6dee8;font-size:16px;line-height:1.35;margin:10px 8px 0}

function tex(kind){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
if(kind!='usd'){const P=kind=='pstar',g=x.createRadialGradient(64,64,4,64,64,62);g.addColorStop(0,P?'rgba(190,140,255,.9)':'rgba(255,220,100,.9)');g.addColorStop(1,P?'rgba(120,70,220,0)':'rgba(255,170,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);x.beginPath();for(let i=0;i<10;i++){const r=i%2?17:36,a=-Math.PI/2+i*Math.PI/5;x.lineTo(64+r*Math.cos(a),64+r*Math.sin(a))}x.closePath();x.fillStyle=P?'#c9a4ff':'#ffd23f';x.fill();x.strokeStyle=P?'#efe0ff':'#fff4b0';x.lineWidth=3;x.stroke()}
else{x.fillStyle='#1f9d4a';x.strokeStyle='#8df5a8';x.lineWidth=4;x.beginPath();x.rect(10,32,108,64);x.fill();x.stroke();x.beginPath();x.arc(64,64,20,0,7);x.stroke();x.fillStyle='#d6ffe0';x.font='bold 34px Roboto,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('$',64,66)}
return new THREE.CanvasTexture(c)}
function rain(host,kind,hp){if(!window.THREE)return;const w=()=>host.clientWidth,h=()=>hp||host.clientHeight;
const R=new THREE.WebGLRenderer({alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w(),h());R.domElement.className='cv'+(hp?' fb':'');host.prepend(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,w()/h(),.1,100);cam.position.z=8;
const t=tex(kind),N=S.eco?14:55,P=[];
for(let i=0;i<N;i++){const m=new THREE.SpriteMaterial({map:t,transparent:true,opacity:.35+Math.random()*.6}),s=new THREE.Sprite(m),k=.5+Math.random()*.8;s.scale.set(kind!='usd'?k:k*1.5,kind!='usd'?k:k*.95,1);s.position.set((Math.random()-.5)*16,Math.random()*14-7,Math.random()*6-4);s.v=.02+Math.random()*.05;s.r=(Math.random()-.5)*.04;sc.add(s);P.push(s)}
let id,on=true;const f=()=>{if(!on)return;id=requestAnimationFrame(f);P.forEach(s=>{s.position.y-=s.v;if(kind!='usd')s.position.x-=s.v*.4;s.material.rotation+=s.r;if(s.position.y<-7){s.position.y=7;s.position.x=(Math.random()-.5)*16}});R.render(sc,cam)};f();
host.onclose=()=>{on=false;cancelAnimationFrame(id);R.dispose();t.dispose()}}

const f=t=>{if(!cv.isConnected)return;const dt=Math.min((t-last)/16.7,3);last=t;x.clearRect(0,0,W,H);let alive=0;
for(const p of P){if(p.dead)continue;if(p.d>0){p.d-=dt;alive++;continue}p.vy+=g*dt;p.x+=(p.vx+Math.sin(p.ph+=.06*dt)*.5)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
if(p.vy>0&&p.y>H+70){p.dead=1;continue}alive++;if(!p.im.complete)continue;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.drawImage(p.im,-p.s/2,-p.s/2,p.s,p.s);x.restore()}
if(alive)requestAnimationFrame(f);else cv.remove()};requestAnimationFrame(f);setTimeout(()=>cv.remove(),7000)}
// ---- сообщение-подарок в чате ----
function gcard(x,us){const g=C.gifts[x.g],K=g&&GIFTS[g.k];if(!K)return`<div class="gcw"><div class="gcc"><div class="gct">Подарок</div></div></div>`;
const to=us[g.to]||{nick:'?'},fr=us[g.from]||{nick:'?'};
return`<div class="gcw"><div class="gcc" data-g="${g.id}">${gi(g.k,128,g.sold?'dim':'')}<div class="gct">Подарок от ${esc(dn(fr))}</div><div class="gcs">${g.sold?`${esc(dn(to))} обменял(а) подарок на звёзды.`:`${esc(dn(to))} может обменять его на звёзды или оставить в профиле.`}</div>${g.tx?`<div class="gcm">${esc(g.tx)}</div>`:''}</div></div>`}

// ---------- boot ----------
(async()=>{await open();const e=await dbGet('meta','eco');S.eco=!!(e&&e.v);E.classList.toggle('eco',S.eco);let first=true;
au.onAuthStateChanged(async cu=>{if(!first)return;first=false;if(!cu)return authView();
await attach(cu.uid);const u=C.users[cu.uid],c=await dbGet('meta','cur');
if(u&&c&&c.uid==cu.uid&&C.sessions[c.sid]&&!u.banned){S.u=u;S.sid=c.sid;return home()}
const msg=u&&u.banned?'Ваш аккаунт заблокирован. Вы можете войти в другой аккаунт.':(c?'Сеанс завершён на другом устройстве':'');
detach();await dbDel('meta','cur');await au.signOut();authView(msg)})})();
</script></body></html>
