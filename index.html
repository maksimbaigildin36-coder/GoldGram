<div class="cd">${CR('link',G1,'Управление приглашениями','','inv')}</div><div class="hint">Вы можете скопировать ссылку или создать новую.</div>

function svgChart(vals,labels,opt={}){const W=340,H=170,pl=34,pb=22,pt=8,pr=6,mx=Math.max(1,...vals.flat()),e=Math.pow(10,Math.floor(Math.log10(mx))),m=mx/e,nice=(m<=1?1:m<=2?2:m<=5?5:10)*e,n=labels.length,iw=W-pl-pr,ih=H-pt-pb;
const X=i=>pl+(n<2?0:i*iw/(n-1)),Y=v=>pt+ih-v/nice*ih,cols=opt.cols||['#4a9be0'];let g='';
for(let k=0;k<=4;k++){const v=nice*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#2a384b"/><text x="${pl-5}" y="${y+4}" fill="#7b8ba0" font-size="10" text-anchor="end">${+v.toFixed(1)}</text>`}
for(let i=0;i<n;i+=Math.ceil(n/6))g+=`<text x="${X(i)}" y="${H-6}" fill="#7b8ba0" font-size="10" text-anchor="middle">${labels[i]}</text>`;
if(opt.bars){const bw=Math.max(2,iw/n/(vals.length+.4)*.9);vals.forEach((s,si)=>s.forEach((v,i)=>{if(!v)return;const x=X(i)-bw*vals.length/2+si*bw,y=Y(v);g+=`<rect x="${x}" y="${y}" width="${bw}" height="${pt+ih-y}" fill="${cols[si]}" rx="1"/>`}))}
else vals.forEach((s,si)=>{g+=`<polyline fill="none" stroke="${cols[si]}" stroke-width="2.2" stroke-linejoin="round" points="${s.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`});
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>`}
function chStats(cid){const p=page('Статистика','<div id="sx"></div>');
const rd=()=>{const c=CH(cid);if(!c)return;const D=864e5,now=Date.now(),msgs=Object.values(C.messages).filter(m=>m.cid==cid);
const jl=c.jl||{},joins=c.members.map(u=>jl[u]||c.created),lv=c.lv||[];
const subsAt=t=>joins.filter(j=>j<=t).length+lv.filter(x=>x.j<=t&&x.t>t).length;
const st=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const days=Array.from({length:30},(_,i)=>st(now-(29-i)*D)),pad=x=>String(x).padStart(2,'0'),lab=days.map(t=>{const d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1)});
const dayOf=t=>days.findIndex(d=>t>=d&&t<d+D);
const grow=days.map(d=>subsAt(d+D-1)),jn=days.map(()=>0),lf=days.map(()=>0),vw=days.map(()=>0);
joins.concat(lv.map(x=>x.j)).forEach(j=>{const i=dayOf(j);if(i>=0)jn[i]++});lv.forEach(x=>{const i=dayOf(x.t);if(i>=0)lf[i]++});msgs.forEach(m=>{const i=dayOf(m.t);if(i>=0)vw[i]+=vcnt(m)});
const win=(a,b)=>msgs.filter(m=>m.t>=a&&m.t<b),avg=l=>l.length?Math.round(l.reduce((s,m)=>s+vcnt(m),0)/l.length):0;
const cur=subsAt(now),prev=subsAt(now-7*D),av1=avg(win(now-7*D,now+1)),av0=avg(win(now-14*D,now-7*D)),rxn=win(now-7*D,now+1).reduce((s,m)=>s+Object.keys(m.rx||{}).length,0);
const dl=(a,b)=>{const d=a-b;return d?`<span style="font-size:17px;color:${d>0?'#4cc968':'#ef5b5b'}"> ${d>0?'+':''}${d} (${(b?Math.abs(d/b*100):100).toFixed(1)}%)</span>`:''};
const dd=t=>{const d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)};

const card=(t,body)=>`<div class="cd" style="padding:16px 12px 10px"><div style="display:flex;justify-content:space-between;padding:0 7px 10px"><b style="font-size:19px;font-weight:500">${t}</b><span style="color:var(--m);font-size:14px">${dd(days[0])} — ${dd(now)}</span></div>${body}</div>`;

${card('Рост',svgChart([grow],lab))}${card('Подписчики',svgChart([jn,lf],lab,{bars:1,cols:['#4cc968','#ef5b5b']})+'<div style="display:flex;gap:16px;padding:4px 10px;font-size:14px;color:var(--m)"><span><span style="color:#4cc968">●</span> Подписались</span><span><span style="color:#ef5b5b">●</span> Отписались</span></div>')}${card('Просмотры публикаций',svgChart([vw],lab,{bars:1}))}`};

const AVC={},AVQ=new Set();let avBusy=false;
const applyAv=()=>{const need=[];for(const u of Object.values(C.users)){if(u.bot)continue;if(LS[u.id])u.ls=LS[u.id];if(!u.avh){u.avatar='';continue}const a=AVC[u.id];if(a&&a.h==u.avh)u.avatar=a.d;else{u.avatar=a?a.d:'';need.push(u.id)}}for(const c of Object.values(C.chats)){if(c.avh===undefined)continue;if(!c.avh){c.avatar='';continue}const a=AVC[c.id];if(a&&a.h==c.avh)c.avatar=a.d;else{c.avatar=a?a.d:'';need.push(c.id)}}C.users.spambot=BOTU;if(need.length)avLoad(need)};
const avLoad=async ids=>{const me=S.u&&S.u.id;ids.sort((a,b)=>(b==me)-(a==me));ids.forEach(i=>AVQ.add(i));if(avBusy)return;avBusy=true;

const pollLs=async()=>{try{const r=await dbw(SB.from('presence').select('id,ls'));let ch=0;for(const x of r){LS[x.id]=x.ls;const u=C.users[x.id];if(u&&u.ls!=x.ls){const a=seenInfo(u).on;u.ls=x.ls;if(seenInfo(u).on!=a)ch=1}}if(ch)notify()}catch(e){}};
const loadSeen=async me=>{const r=await dbw(SB.from('seens').select('cid,n').eq('uid',me));C.seenMap={};r.forEach(x=>C.seenMap[x.cid]=x.n)};
const seenOf=c=>(C.seenMap||{})[c.id]||0;

const vcnt=x=>{const s=new Set(x.v||[]);((C.vw||{})[x.id]||[]).forEach(u=>s.add(u));if(VIEWED.has(x.id)&&S.u)s.add(S.u.id);return s.size};
const fdm=t=>{const d=new Date(t);return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear()};
const isMod=()=>!!(S.u&&['Spam Moderator','Moderator Channels'].includes(S.u.prefix));

const popup=(icon,t,s,fn)=>{const e=document.createElement('div');e.className='gtoast';if(fn)e.style.cursor='pointer';e.innerHTML=`${icon}<div><b>${esc(t)}</b><div>${esc(s)}</div></div>`;if(fn)e.onclick=()=>{e.remove();fn()};E.append(e);setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),250)},4500)};
const botWatch=()=>{if(!S.u)return;const cid='bot_'+S.u.id;for(const m of Object.values(C.messages)){if(m.cid!=cid||m.uid!='spambot'||BW.ids[m.id])continue;BW.ids[m.id]=1;if(BW.r&&S.open!=cid)popup(av(BOTU,'sm'),'Spam Bot',String(m.text).slice(0,100),()=>openChat(cid))}BW.r=true};
const pfxWatch=()=>{const u=S.u&&C.users[S.u.id];if(!u)return;if(PFX.t===null){PFX.t=u.pfxT||0;return}
if(u.pfxT&&u.pfxT>PFX.t&&u.prefix){PFX.t=u.pfxT;popup(`<div style="width:44px;height:44px;flex:none">${pfxSvg[u.prefix]||ic('shield',40)}</div>`,'Вам выдан префикс',`«${u.prefix}» — выдал пользователь ${u.pfxBy||'donke'}`)}};

async function reportDecide(a){const k=a.split(':')[0],r=a.split(':')[1];if(!isOwner())return;try{await rpc('report_decide',{p_rid:r,p_punish:k=='punish'});toast(k=='punish'?'Наказание выдано':'Жалоба отменена')}catch(x){x.code=='gone'?toast('Жалоба уже обработана'):fer(x)}}

function msgMenu(cid,mid){const m=C.messages[mid];if(!m||m.uid=='spambot'||m.uid==S.u.id)return;const c=CH(cid),ch=c&&c.type=='channel',l=(c&&c.rxList)||RX0;
