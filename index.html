<style>

.pg{animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.85,.25,1)}

.modal>div{animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}

.modal.out{animation:fo .19s ease-in forwards}.modal.out>div{animation:pd .19s ease-in forwards}
@keyframes fo{to{opacity:0}}@keyframes pd{to{opacity:0;transform:scale(.94) translateY(8px)}}
.toast{animation:ti .28s cubic-bezier(.2,.9,.3,1.1)}.toast.out{animation:tq .25s ease-in forwards}

nav button.on{background:#1f3550;color:#42a5f5}

.ops{background:var(--c);border-radius:26px;margin-top:14px;overflow:hidden;text-align:left}

select{flex:1;min-width:0;background:var(--c2);color:#fff;border:1px solid #2c3b50;border-radius:14px;padding:13px 6px;font:500 16px Roboto;outline:0}

const inf=()=>{$('#inf',p).innerHTML=SR('at','linear-gradient(135deg,#ffb52e,#f0820f)',u.username?'@'+esc(u.username):'Не задано','Имя пользователя','un')+SR('cake','linear-gradient(135deg,#3aa6f5,#1f80d8)',u.bday?fb(u.bday):'Не указан','День рождения','bd')};inf();
$('#ab3',p).oninput=e=>{$('#cn',p).textContent=70-e.target.value.length};
p.onclick=e=>{const r=e.target.closest('[data-r]');if(!r)return;if(r.dataset.r=='un')usernamePage(inf);else if(r.dataset.r=='bd')bdayPicker(inf);else if(r.dataset.r=='out')logout()};
p.onclose=()=>{const n=$('#an2',p).value.trim(),a=$('#ab3',p).value.trim(),patch={};if(n&&n!=dn(u))patch.name=n;if(a!=(u.about||''))patch.about=a;if(Object.keys(patch).length)upd(patch).then(ok=>{if(ok){toast('Сохранено');S.tab=='prof'?profView():S.tab=='set'?setView():0}})}}
function usernamePage(done){const u=S.u,p=page('Имя пользователя',`<div class="cd"><div class="lb">Задать имя пользователя</div><div class="un"><span>gd.me/</span><input id="un" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(u.username||'')}"></div></div><div class="us n" id="us"></div>
<div class="hint">Вы можете выбрать публичное имя пользователя в PradaGram. В этом случае другие люди смогут найти Вас по такому имени и открыть профиль, не зная Вашего ника.<br><br>Можно использовать символы a–z, 0–9 и подчёркивания. Минимальная длина — 5 символов.</div>`);
const ok=document.createElement('button');ok.className='ib';ok.style.marginLeft='auto';ok.innerHTML=ic('check',28);$('.pgt',p).append(ok);
const st=$('#us',p),inp=$('#un',p);let good=true,tm=0,seq=0;const say=(c,t,g)=>{st.className='us '+c;st.textContent=t;good=g};
const chk=()=>{const raw=inp.value,v=raw.replace(/[^A-Za-z0-9_]/g,'');if(v!=raw)inp.value=v;const l=v.toLowerCase();clearTimeout(tm);++seq;
if(!v)return say('n','Имя пользователя будет удалено.',true);
if(v.length<5)return say('bad','Минимальная длина — 5 символов.',false);
if(l=='donke'&&u.id!=OWNER_UID)return say('bad','Это имя недоступно.',false);
if(l==u.ul)return say('n','Это ваше текущее имя.',true);
say('n','Проверяем…',false);const my=seq;tm=setTimeout(async()=>{try{const d=await fs.doc('usernames/'+l).get();if(my!=seq)return;d.exists?say('bad','Имя '+v+' занято.',false):say('ok','Имя '+v+' свободно.',true)}catch(e){if(my==seq)say('n','Не удалось проверить имя.',true)}},350)};
inp.oninput=chk;chk();setTimeout(()=>inp.focus(),300);
ok.onclick=async()=>{if(!good)return toast('Это имя нельзя использовать');if(ok.disabled)return;const nu=inp.value.trim(),nl=nu.toLowerCase();if(nu==(u.username||''))return p.close();
ok.disabled=true;try{const b=fs.batch();b.update(fs.doc('users/'+u.id),{username:nu,ul:nl});if(nu&&nl!=u.ul)b.set(fs.doc('usernames/'+nl),{uid:u.id});if(u.ul&&u.ul!=nl)b.delete(fs.doc('usernames/'+u.ul));await b.commit();
u.username=nu;u.ul=nl;toast(nu?'Имя пользователя сохранено':'Имя пользователя удалено');done&&done();p.close()}
catch(x){console.error(x);ok.disabled=false;say('bad',x.code=='permission-denied'?'Имя занято или недоступно.':'Ошибка: '+(x.code||x.message),false)}}}
function bdayPicker(done){const u=S.u,c=(u.bday||'').split('-').map(Number),n=new Date(),o=(v,t,sel)=>`<option value="${v}" ${sel?'selected':''}>${t}</option>`;
const m=modal(`<h3>День рождения</h3><div style="display:flex;gap:8px;margin-top:10px"><select id="bd">${o('','День',!c[2])}${Array.from({length:31},(_,i)=>o(i+1,i+1,c[2]==i+1)).join('')}</select><select id="bm">${o('','Месяц',!c[1])}${MONF.map((t,i)=>o(i+1,t,c[1]==i+1)).join('')}</select><select id="by">${o('','Год',!c[0])}${Array.from({length:n.getFullYear()-1899},(_,i)=>o(n.getFullYear()-i,n.getFullYear()-i,c[0]==n.getFullYear()-i)).join('')}</select></div>
<div class="err" id="be"></div><button class="btn" id="bs">Сохранить</button>${u.bday?'<button class="btn g" id="br">Удалить</button>':''}`);
const save=async v=>{if(await upd({bday:v})){toast(v?'День рождения сохранён':'День рождения удалён');done&&done();m.remove();S.tab=='prof'&&profView()}};
$('#bs',m).onclick=()=>{const d=+$('#bd',m).value,mo=+$('#bm',m).value,y=+$('#by',m).value,e=t=>$('#be',m).textContent=t;if(!d||!mo||!y)return e('Выберите день, месяц и год');const dt=new Date(y,mo-1,d);if(dt.getMonth()!=mo-1)return e('Такой даты не существует');if(dt>n)return e('Дата в будущем');save(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`)};
if($('#br',m))$('#br',m).onclick=()=>save('')}
// ---------- SPC PANEL ----------
// запись владельца: ждём подтверждения сервера
const PD=x=>{console.error(x);return x.code=='permission-denied'?'Сервер отклонил запись. Проверьте, что в Firebase опубликованы актуальные правила (firestore.rules) и вы вошли под ником donke.':'Ошибка: '+(x.code||x.message)};
async function adminPatch(id,patch){if(!isOwner())return 'Нет доступа';try{await fs.doc('users/'+id).update(patch);return null}catch(x){return PD(x)}}
async function adminGive(t,n){if(!isOwner())return 'Нет доступа';try{const b=fs.batch(),id=uid();b.update(fs.doc('users/'+t.id),{stars:firebase.firestore.FieldValue.increment(n)});b.set(fs.doc(`users/${t.id}/ops/${id}`),{id,t:Date.now(),n,from:S.u.nick,fid:S.u.id});await b.commit();return null}catch(x){return PD(x)}}
function spcGate(){if(!isOwner())return toast('Нет доступа');spcPanel()}
function spcPanel(){const p=page('SPC PANEL',`<div class="card" style="padding:14px"><button class="btn" data-f="give">Выдача звёзд по NickName</button><button class="btn r" data-f="ban">Заблокировать аккаунт по NickName</button><button class="btn g" data-f="unban">Разблокировать аккаунт по NickName</button><button class="btn" style="background:#b8791a" data-f="self">Выдача звёзд себе</button></div>`);p.onclick=e=>{const b=e.target.closest('[data-f]');b&&flow(b.dataset.f)}}
function flow(k){const T={give:'Выдача звёзд по NickName',ban:'Заблокировать аккаунт',unban:'Разблокировать аккаунт',self:'Выдача звёзд себе'};const m=modal(`<h3>${T[k]}</h3><div id="fb"></div>`),b=$('#fb',m);let tg=null;
const s3=()=>{b.innerHTML=`<div class="note" style="margin-top:0">Игрок: <b>${esc(tg.nick)}</b> (${tg.banned?'заблокирован':'активен'})</div><div class="err" id="fe"></div><button class="btn ${k=='ban'?'r':''}" id="fo">Подтвердить</button>`;$('#fo',m).onclick=async()=>{const e=t=>$('#fe',m).textContent=t,bt=$('#fo',m);if(bt.disabled)return;
const d=await fs.doc('users/'+tg.id).get().catch(()=>null);if(!d||!d.exists)return e('Игрок не найден или нет сети');const cur=d.data();
if(k=='ban'){if(tg.id==S.u.id)return e('Нельзя заблокировать самого себя');if(cur.banned)return e('Аккаунт уже заблокирован')}else if(!cur.banned)return e('Аккаунт не заблокирован');
bt.disabled=true;const er=await adminPatch(tg.id,{banned:k=='ban'});bt.disabled=false;if(er)return e(er);
toast('Аккаунт '+tg.nick+(k=='ban'?' заблокирован':' разблокирован'));m.remove()}};
const s2=()=>{b.innerHTML=`<div class="note" style="margin-top:0">Получатель: <b>${esc(tg.nick)}</b></div><input id="fa" type="number" min="1" max="2500000" placeholder="Количество звёзд (макс. 2 500 000)"><div class="err" id="fe"></div><button class="btn" id="fo">Выдать</button>`;$('#fo',m).onclick=async()=>{const bt=$('#fo',m),e=t=>$('#fe',m).textContent=t;if(bt.disabled)return;const n=Number($('#fa',m).value);if(!Number.isInteger(n)||n<1)return e('Введите целое число больше 0');if(n>2500000)return e('Максимум — 2 500 000');
bt.disabled=true;const er=await adminGive(tg,n);bt.disabled=false;if(er)return e(er);
if(C.users[S.u.id])S.u=C.users[S.u.id];toast(`Выдано ${n.toLocaleString('ru')} звёзд — ${tg.nick}`);m.remove();if(S.tab!='chats')go(S.tab)}};
if(k=='self'){tg=S.u;return s2()}
b.innerHTML=`<input id="fn" placeholder="NickName игрока"><div class="err" id="fe"></div><button class="btn" id="fo">Проверить</button>`;
$('#fo',m).onclick=async()=>{const n=$('#fn',m).value.trim().toLowerCase();if(!n)return $('#fe',m).textContent='Введите NickName';tg=(await dbAll('users')).find(x=>x.nl==n);if(!tg)return $('#fe',m).textContent='Игрок с таким NickName не найден';k=='give'?s2():s3()}}
// ---------- boot ----------
(async()=>{await open();const e=await dbGet('meta','eco');S.eco=!!(e&&e.v);E.classList.toggle('eco',S.eco);let first=true;
au.onAuthStateChanged(async cu=>{if(!first)return;first=false;if(!cu)return authView();
await attach(cu.uid);const u=C.users[cu.uid],c=await dbGet('meta','cur');
if(u&&c&&c.uid==cu.uid&&C.sessions[c.sid]&&!u.banned){S.u=u;S.sid=c.sid;return home()}
const msg=u&&u.banned?'Ваш аккаунт заблокирован. Вы можете войти в другой аккаунт.':(c?'Сеанс завершён на другом устройстве':'');
detach();await dbDel('meta','cur');await au.signOut();authView(msg)})})();
</script></body></html>
